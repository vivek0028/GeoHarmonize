services:
  - type: web
    name: geoharmonize-backend
    runtime: docker
    dockerfilePath: Dockerfile
    autoDeploy: true
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoharmonize-postgis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: geoharmonize-postgis-db
    databaseName: geoharmonize
    user: geoharmonize
    plan: free
    region: oregon
